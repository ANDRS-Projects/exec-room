name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite runs the server against the fakes in tests/fakes (no network, accounts or credits);
      # python3 comes with the runner. Its rooms read ~/Dev and it checks the blocks on ~/.claude and
      # ~/Library, so the runner's home gets the folders a Claude Code user's Mac has.
      - run: mkdir -p ~/Dev ~/Library ~/.claude/agents ~/.claude/skills ~/.claude/knowledge ~/.claude/projects
      - run: npm ci
      - run: npm test
